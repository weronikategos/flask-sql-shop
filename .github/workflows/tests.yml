name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and check that the shop responds
        run: |
          docker build -t flask-sql-shop .
          docker run -d -p 8000:8000 --name shop flask-sql-shop
          for i in $(seq 1 20); do curl -fs http://localhost:8000/api/health && break; sleep 1; done
          curl -fs http://localhost:8000/api/health
          curl -fs http://localhost:8000/api/products | head -c 300
